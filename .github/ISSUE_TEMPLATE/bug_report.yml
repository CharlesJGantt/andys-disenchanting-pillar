name: Bug report
description: Report a reproducible problem with Andy's Disenchanting Pillar.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: addon-version
    attributes:
      label: Add-on version
      placeholder: "1.6.5"
    validations:
      required: true
  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Bedrock version and platform
      placeholder: "26.x on Windows, Xbox, PlayStation, Switch, Android, or iOS"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Place...
        2. Insert...
        3. Select...
    validations:
      required: true
  - type: dropdown
    id: matching-packs
    attributes:
      label: Are both included packs active at the same version?
      options:
        - "Yes"
        - "No"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: content-log
    attributes:
      label: Relevant content-log messages
      description: Paste only messages related to this add-on.
      render: text
  - type: textarea
    id: other-addons
    attributes:
      label: Other active add-ons
      description: List other add-ons and say whether the issue remains when they are disabled.
